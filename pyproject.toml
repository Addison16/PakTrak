[project]
name = "mtg-scanner"
version = "0.1.0"
description = "Docker-first, server-side MTG scanner and collection migration"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.53.0",
  "pydantic-settings==2.15.0",
  "SQLAlchemy==2.0.54",
  "psycopg[binary]==3.3.5",
  "alembic==1.20.0",
  "celery==5.6.3",
  "redis==8.1.0",
  "boto3==1.43.97",
  "Pillow==12.3.0",
  "pi-heif==1.4.0",
  "authlib==1.8.0",
  "cryptography==50.0.1",
  "httpx==0.28.1",
  "itsdangerous==2.2.0",
  "opencv-python-headless==5.0.0.93",
  "ijson==3.5.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["services/backend"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["services/backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
