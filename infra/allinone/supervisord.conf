; Long-running PakTrak services. "startup" starts the services marked
; autostart=false in order once their dependencies are ready. On shutdown
; supervisord stops the app first, then the database and broker, and storage
; last, since it can wait 20 seconds to drain and is stopped after 10.
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/paktrak/supervisord.pid

[unix_http_server]
file=/run/paktrak/supervisord.sock
chmod=0700

[supervisorctl]
serverurl=unix:///run/paktrak/supervisord.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:database]
; The PostgreSQL image's entrypoint initializes an empty /data/postgres.
command=docker-entrypoint.sh postgres -c listen_addresses=127.0.0.1
priority=10
stopsignal=INT
stopwaitsecs=90
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:broker]
command=valkey-server --appendonly yes --dir /data/broker --bind 127.0.0.1 --port 6379
priority=10
user=paktrak
environment=HOME="/home/paktrak"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:storage]
command=weed server -dir=/data/photos -ip=127.0.0.1 -ip.bind=127.0.0.1 -s3 -s3.port=8333 -master.volumeSizeLimitMB=1024 -volume.max=64
user=paktrak
environment=HOME="/home/paktrak"
priority=5
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:startup]
command=paktrak-startup
autorestart=false
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:identity]
command=/opt/keycloak/bin/kc.sh start --optimized
user=paktrak
environment=HOME="/home/paktrak"
autostart=false
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:api]
command=uvicorn scanner.api:app --host 127.0.0.1 --port 8000 --no-access-log
directory=/app
user=paktrak
environment=HOME="/home/paktrak"
autostart=false
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:worker]
command=celery -A scanner.worker:celery worker --loglevel=WARNING --concurrency=1 --queues=scans --hostname=scans@%%h
directory=/app
user=paktrak
environment=HOME="/home/paktrak"
autostart=false
stopwaitsecs=70
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:transfer-worker]
command=celery -A scanner.worker:celery worker --loglevel=WARNING --concurrency=1 --queues=transfers --hostname=transfers@%%h
directory=/app
user=paktrak
environment=HOME="/home/paktrak"
autostart=false
stopwaitsecs=70
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:dispatcher]
command=python -m scanner.dispatcher
directory=/app
user=paktrak
environment=HOME="/home/paktrak"
autostart=false
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:data-worker]
command=python -m scanner.data_sync
directory=/app
user=paktrak
environment=HOME="/home/paktrak"
autostart=false
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:web]
command=nginx -e stderr -c /run/paktrak/nginx.conf
user=paktrak
environment=HOME="/home/paktrak"
autostart=false
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
