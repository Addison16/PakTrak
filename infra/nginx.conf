map $canonical_origin $canonical_scheme {
    ~^https:// https;
    default http;
}
map $canonical_origin $canonical_port {
    "~^https?://.+:(?<origin_port>[0-9]+)$" $origin_port;
    ~^https:// 443;
    default 80;
}
map $canonical_origin $canonical_host {
    "~^https?://(?<origin_host>[^/]+)$" $origin_host;
    default localhost;
}

server {
    set $canonical_origin "${APP_URL}";
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 100m;
    client_body_timeout 600s;
    access_log off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $canonical_scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
    }
    location /identity/ {
        proxy_pass http://identity:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $canonical_scheme;
        proxy_set_header X-Forwarded-Host $canonical_host;
        proxy_set_header X-Forwarded-Port $canonical_port;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control no-cache;
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control no-cache;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";
        try_files $uri $uri/ /index.html;
    }
}
