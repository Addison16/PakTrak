# Opt-in source builds: docker compose -f compose.yaml -f compose.build.yaml …
x-backend-build: &backend-build
  build:
    context: .
    dockerfile: services/backend/Dockerfile
    target: runtime

services:
  database-setup:
    <<: *backend-build
  migrate:
    <<: *backend-build
  api:
    <<: *backend-build
  worker:
    <<: *backend-build
  transfer-worker:
    <<: *backend-build
  dispatcher:
    <<: *backend-build
  data-worker:
    <<: *backend-build
  web:
    build: &web-build
      context: .
      dockerfile: apps/web/Dockerfile
  identity-theme:
    build: *web-build
  tests:
    build:
      context: .
      dockerfile: services/backend/Dockerfile
      target: test
